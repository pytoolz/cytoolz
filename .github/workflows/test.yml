name: Test

on:
  push:
    branches:
      - master
      - release
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        cython-version: ["0.29.37", "3.3.0"]
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.13t"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
          - "pypy3.9"
          - "pypy3.10"
          - "pypy3.11"
          - "pypy3.12"
        exclude:
          # Cython 0.29 does not support Python 3.13+ or PyPy 3.11+
          - cython-version: "0.29.37"
            python-version: "3.13"
          - cython-version: "0.29.37"
            python-version: "3.13t"
          - cython-version: "0.29.37"
            python-version: "3.14"
          - cython-version: "0.29.37"
            python-version: "3.14t"
          - cython-version: "0.29.37"
            python-version: "3.15"
          - cython-version: "0.29.37"
            python-version: "3.15t"
          - cython-version: "0.29.37"
            python-version: "pypy3.11"
          - cython-version: "0.29.37"
            python-version: "pypy3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools setuptools-git-versioning
          pip install cython==${{ matrix.cython-version }}
          pip install git+https://github.com/pytoolz/toolz.git
          # No build isolation, so the build uses the Cython version above
          pip install --no-build-isolation -e . --group test
      - name: PyTest
        run: |
          pytest --doctest-modules cytoolz/
          # For convenience, make sure simple test commands work
          pytest
          # Make sure we can cimport cytoolz
          echo 'cimport cytoolz ; from cytoolz.functoolz cimport memoize' > try_cimport_cytoolz.pyx
          cythonize -i try_cimport_cytoolz.pyx
          python -c 'import try_cimport_cytoolz'
          python -c 'import cytoolz ; print(f"{cytoolz.__version__=}")'
