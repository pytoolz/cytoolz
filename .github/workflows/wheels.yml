name: Build Wheels and Release

on:
  # pull_request:  # Uncomment to debug wheel building in a PR
  workflow_dispatch:
    inputs:
      upload_dest:
        type: choice
        description: Upload wheels to
        options:
          - No Upload
          - PyPI
          - Test PyPI
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  wheels:
    name: Build wheels for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
            archs: auto64 auto32
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
            archs: auto64 auto32
          - os: linux-qemu-ppc64le
            runs-on: ubuntu-latest
            archs: ppc64le
          - os: linux-qemu-s390x
            runs-on: ubuntu-latest
            archs: s390x
          - os: linux-qemu-riscv64
            runs-on: ubuntu-latest
            archs: riscv64
          - os: windows-intel
            runs-on: windows-latest
            archs: auto64 auto32
          - os: windows-arm
            runs-on: windows-11-arm
            archs: auto64 auto32
          - os: macos-intel
            # macos-15-intel is the last x86_64 runner
            runs-on: macos-15-intel
            archs: auto
          - os: macos-arm
            # macos-14+ (including latest) are ARM64 runners
            runs-on: macos-latest
            archs: auto universal2
          - os: ios
            runs-on: macos-latest
            platform: ios
            archs: all
          - os: pyodide
            # pyodide is not yet supported by PyPI, but let's make sure we can build for it
            runs-on: ubuntu-latest
            platform: pyodide
            archs: all

    steps:
      - name: Setup QEMU
        if: ${{ startsWith(matrix.os, 'linux-qemu') }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: all
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6  # v4.3.0
        env:
          CIBW_PLATFORM: ${{ matrix.platform || 'auto' }}
          CIBW_ARCHS: ${{ matrix.archs || 'auto' }}
          CIBW_BUILD: "cp* pp*"
          CIBW_ENABLE: "pypy"  # free-threaded CPython 3.14+ is built by default
          CIBW_TEST_SKIP: "*-ios_*"
      - name: List wheels
        run: |
          ls -al wheelhouse/
      - name: Upload wheels
        if: matrix.platform != 'pyodide'  # pyodide is not yet supported by PyPI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build sdist
        run: python -m build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          retention-days: 7

  upload-to-test-pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: github.repository == 'pytoolz/cytoolz' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' && github.event.inputs.upload_dest == 'Test PyPI')

    environment:
      name: test-pypi
      url: https://test.pypi.org/p/cytoolz
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to Test-PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          verbose: true

  upload-to-pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: github.repository == 'pytoolz/cytoolz' && startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || github.event.inputs.upload_dest == 'PyPI')

    environment:
      name: pypi
      url: https://pypi.org/p/cytoolz
    permissions:
      id-token: write
      attestations: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: |
          ls -al dist/
      - name: Generate artifact attestation for sdist and wheels
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/cytoolz-*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
          print-hash: true
          verbose: true
